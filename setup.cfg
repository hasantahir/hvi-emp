# All packaging metadata is in pyproject.toml (PEP 621 / PEP 639).
#
# An earlier version of this file duplicated name/version/install_requires
# here as a fallback for setuptools < 61. That was a mistake: on any current
# setuptools the duplicate `install_requires` emits
#
#     SetuptoolsWarning: `install_requires` overwritten in `pyproject.toml`
#
# on every single build, for the sake of a toolchain obsolete since 2022.
# pyproject.toml is now the single source of truth.
