# Root Hydra configuration.
#
#   python -m hvi_emp.run                                  # defaults below
#   python -m hvi_emp.run scenario=fletcher_w_al           # swap a group
#   python -m hvi_emp.run scenario.velocity=62e3           # override a field
#   python -m hvi_emp.run sweep=velocity cluster=slurm_cpu # compose
#   python -m hvi_emp.run --multirun scenario.velocity=40e3,50e3,60e3
#
# Every composed config is validated by hvi_emp.schema before anything runs,
# so a bad value fails in the first second rather than in the third hour of a
# cluster job.

defaults:
  - scenario: default
  - sweep: none
  - cluster: local
  - _self_

output_dir: results
tag: run
seed: 0

# Hydra's own settings. The run directory carries the tag and a timestamp so
# two submissions never overwrite each other's output -- on a shared
# filesystem that is a real failure mode, not a hypothetical one.
hydra:
  run:
    dir: ${output_dir}/${tag}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${output_dir}/${tag}/multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false
