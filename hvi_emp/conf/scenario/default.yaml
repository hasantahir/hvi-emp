# The reference case: 1 pg of iron onto aluminium at 50 km/s.
projectile: Fe
target: Al
# Projectile size: give EITHER mass (kg) OR diameter (m), never both.
# Debris populations are quoted by size, so `diameter` is often the natural
# input; it is converted with the projectile material's density. To use it,
# set `mass: null` (the default below would otherwise count as "both given").
mass: 0.000000000001          # kg
diameter: null                # m -- e.g. 0.001 for a 1 mm particle
velocity: 50000.0       # m/s  -- NOTE: metres per second, not km/s
angle_deg: 0.0         # from the surface normal

expansion_model: "1T"  # "2T" is the better physics; see docs/PHYSICS_AUDIT.md

# Initial plume R_z/R_r. CALIBRATED, not derived: 1.0 is a fixed point of the
# expansion equations and gives an isotropic plume, which the measured cosine
# angular law excludes. 0.5 reproduces that law (asymptotic Rdot_z/Rdot_r =
# 1.33). Moves peak n_e by ~10x across its plausible range, so sweep it if
# your result depends on plume density.
aspect0: 0.5
t_end: null            # null = auto-size the integration window

n_decay: 2.0
core_scale: 1.0
plume_expansion_factor: 3.0

r_sensor: 0.30         # m, sensor standoff
theta_deg: 90.0        # observation angle from the plume axis
# Charge-separation closure -- THE dominant uncertainty in EMP amplitude.
# "debye" is conservative, "fletcher" aggressive, and they differ by ~180x.
# See docs/THEORY.md and the accuracy discussion in docs/EMP_UNCERTAINTY.md.
closure: debye
separation_factor: 1.0        # the O(1) coefficient xi in delta = xi * lambda_D
bands: [315.0e+6, 916.0e+6]
