# Copper -- common in harnesses and shielding.
# Sources: Marsh, LASL Shock Hugoniot Data (1980); CRC Handbook 97th ed.; NIST ASD
#
# Units are SI unless the key says otherwise. Energies suffixed
# _eV are in electron-volts and converted on load.

name: Cu

# --- shock EOS: linear Us = c0 + s*up, Mie-Grueneisen ---
rho0: 8930.0            # kg/m^3
c0: 3940.0               # m/s, bulk sound speed
s: 1.489                  # -, Us-Up slope
gamma0: 1.99             # -, Grueneisen at rho0
us_up_valid_to: 15000   # m/s, beyond this the linear fit is extrapolated

# --- thermophysical ---
cv_solid: 385.0         # J/(kg K)
T_melt: 1358.0            # K
T_vap: 2835.0             # K, 1 atm boiling point
L_fusion: 209000         # J/kg
L_vap: 4.73e+06            # J/kg
E_cohesive_eV: 3.49     # eV/atom, sublimation energy

# --- atomic ---
A: 63.546                 # amu, mean atomic mass
Z: 29                    # -, atomic number
work_function_eV: 4.65

# Successive ionisation potentials I, II, III ... and the
# ground-state statistical weights g_0, g_1, ... (one more than E_ion).
E_ion_eV:
  - 7.7264
  - 20.2924
  - 36.841
g_ion:
  - 2.0
  - 1.0
  - 6.0
  - 25.0
