# Fused silica -- solar-cell coverglass.
# Sources: Marsh (1980) fused silica; Melosh, Impact Cratering (1989) Table AII.2
#
# Units are SI unless the key says otherwise. Energies suffixed
# _eV are in electron-volts and converted on load.

name: SiO2

# --- shock EOS: linear Us = c0 + s*up, Mie-Grueneisen ---
rho0: 2200.0            # kg/m^3
c0: 1500.0               # m/s, bulk sound speed
s: 1.7                  # -, Us-Up slope
gamma0: 0.9             # -, Grueneisen at rho0
us_up_valid_to: 12000   # m/s, beyond this the linear fit is extrapolated

# --- thermophysical ---
cv_solid: 740.0         # J/(kg K)
T_melt: 1986.0            # K
T_vap: 3223.0             # K, 1 atm boiling point
L_fusion: 142000         # J/kg
L_vap: 1.19e+07            # J/kg
E_cohesive_eV: 4.63     # eV/atom, sublimation energy

# --- atomic ---
A: 20.03                 # amu, mean atomic mass
Z: 10                    # -, atomic number
work_function_eV: 5.0

# Successive ionisation potentials I, II, III ... and the
# ground-state statistical weights g_0, g_1, ... (one more than E_ion).
E_ion_eV:
  - 8.1517
  - 16.3459
  - 33.493
g_ion:
  - 9.0
  - 6.0
  - 1.0
  - 2.0
