# Aluminium -- the reference spacecraft structural material.
# Sources: Marsh, LASL Shock Hugoniot Data (1980); CRC Handbook 97th ed.; NIST ASD
#
# Units are SI unless the key says otherwise. Energies suffixed
# _eV are in electron-volts and converted on load.

name: Al

# --- shock EOS: linear Us = c0 + s*up, Mie-Grueneisen ---
rho0: 2700.0            # kg/m^3
c0: 5386.0               # m/s, bulk sound speed
s: 1.339                  # -, Us-Up slope
gamma0: 2.14             # -, Grueneisen at rho0
us_up_valid_to: 20000   # m/s, beyond this the linear fit is extrapolated

# --- thermophysical ---
cv_solid: 897.0         # J/(kg K)
T_melt: 933.5            # K
T_vap: 2792.0             # K, 1 atm boiling point
L_fusion: 397000         # J/kg
L_vap: 1.05e+07            # J/kg
E_cohesive_eV: 3.39     # eV/atom, sublimation energy

# --- atomic ---
A: 26.9815                 # amu, mean atomic mass
Z: 13                    # -, atomic number
work_function_eV: 4.08

# Successive ionisation potentials I, II, III ... and the
# ground-state statistical weights g_0, g_1, ... (one more than E_ion).
E_ion_eV:
  - 5.9858
  - 18.8286
  - 28.4477
g_ion:
  - 6.0
  - 1.0
  - 2.0
  - 1.0
